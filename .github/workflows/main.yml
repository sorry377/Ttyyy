name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "ZIP filename in the repository root (leave blank to auto-detect)"
        required: false
        default: ""
      build_type:
        description: "APK build type"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract ZIP and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        id: extract
        shell: bash
        env:
          REQUESTED_ZIP: ${{ inputs.zip_name }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/project"

          if [[ -n "$REQUESTED_ZIP" ]]; then
            ZIP_PATH="$REQUESTED_ZIP"
            [[ -f "$ZIP_PATH" ]] || { echo "::error::ZIP not found: $ZIP_PATH"; exit 1; }
          else
            ZIP_PATH=""
            for candidate in WorldBoxModLoader-Shizuku.zip WorldBoxModLoader.zip project-source.zip source.zip; do
              if [[ -f "$candidate" ]]; then ZIP_PATH="$candidate"; break; fi
            done
            if [[ -z "$ZIP_PATH" ]]; then
              mapfile -t ZIP_FILES < <(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' | sort)
              if [[ "${#ZIP_FILES[@]}" -eq 1 ]]; then
                ZIP_PATH="${ZIP_FILES[0]}"
              elif [[ "${#ZIP_FILES[@]}" -gt 1 ]]; then
                printf '%s\n' "${ZIP_FILES[@]}"
                echo "::error::Multiple ZIP files found. Set zip_name to the exact filename."
                exit 1
              else
                echo "::error::No ZIP found. Upload WorldBoxModLoader-Shizuku.zip to the repository root."
                exit 1
              fi
            fi
          fi

          echo "Using archive: $ZIP_PATH"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/project"
          SETTINGS_FILE="$(find "$RUNNER_TEMP/project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          [[ -n "$SETTINGS_FILE" ]] || { echo "::error::Gradle settings file not found after extraction."; find "$RUNNER_TEMP/project" -maxdepth 4 -print | head -100; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          [[ -f "$PROJECT_DIR/app/build.gradle" || -f "$PROJECT_DIR/app/build.gradle.kts" ]] || { echo "::error::Android app module not found."; exit 1; }
          [[ -f "$PROJECT_DIR/gradlew" ]] || { echo "::error::gradlew is missing from the ZIP."; exit 1; }
          chmod +x "$PROJECT_DIR/gradlew"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -Eeuo pipefail
          if [[ "$BUILD_TYPE" == "release" ]]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify and collect APK
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -Eeuo pipefail
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/$BUILD_TYPE"
          mkdir -p "$RUNNER_TEMP/apk-output"
          mapfile -t APK_FILES < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print | sort)
          [[ "${#APK_FILES[@]}" -gt 0 ]] || { echo "::error::No APK produced in $APK_DIR"; exit 1; }
          for apk in "${APK_FILES[@]}"; do cp "$apk" "$RUNNER_TEMP/apk-output/"; done
          ls -lh "$RUNNER_TEMP/apk-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldBoxModLoader-${{ inputs.build_type }}-APK
          path: ${{ runner.temp }}/apk-output/*.apk
          if-no-files-found: error
          retention-days: 14

